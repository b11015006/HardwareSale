name: Scrape Catch-up History

on:
  schedule:
    - cron: "30 * * * *" # hourly, offset from Scrape New Articles to avoid push races
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run scrape:catchup
      - name: Commit and push updated article data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/articles data/state
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Scrape: catch-up history"

          # manifest.json is regenerated fresh post-rebase rather than
          # committed as part of the diff above, since it changes on
          # nearly every run and would otherwise be a frequent rebase
          # conflict source against the other scrape workflow. The push
          # itself is still retried: a genuinely concurrent push (from the
          # other scrape workflow, or an overlapping manual dispatch) can
          # still land in the few-second gap between rebase and push.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            node scripts/scrape.mjs manifest
            git add public/data/manifest.json
            git commit --amend --no-edit
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5), retrying..."
            sleep $((RANDOM % 8 + 3))
          done
          echo "::error::Failed to push after 5 attempts"
          exit 1
      - name: Disable this schedule once catch-up is complete
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(jq -r '.done // false' data/state/catchup.json 2>/dev/null)" = "true" ]; then
            echo "Catch-up reached cutoff; disabling future scheduled/manual runs of this workflow."
            gh workflow disable "${{ github.workflow }}"
          fi
